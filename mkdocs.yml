site_name: Operating Documents
site_url: https://www.fivenorthgroup.com/
site_description: "Foundational infrastructure documentation for decentralized financial networks — Five North Group."
site_author: "Five North Group"

watch:
  - overrides

extra_css:
  - stylesheets/fn-tokens.css
  - stylesheets/fn-layout.css
  - stylesheets/extra.css

extra_javascript:
  - javascripts/fn-theme.js

theme:
  name: material
  custom_dir: overrides
  font:
    text: Inter Tight
    code: Red Hat Mono
  logo: assets/logo_infrastructure_for-dark-bg.svg
  favicon: assets/favicon.jpg
  features:
    - navigation.footer
    - navigation.tabs
    - navigation.tabs.sticky

    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tooltips

    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

  # Theme switching is handled by fn-theme.js (docs/javascripts/fn-theme.js).
  # We deliberately DO NOT declare a `palette:` here so Material doesn't
  # auto-apply a scheme on load or render its own palette switcher — that
  # would fight the fivenorth theme toggle.

plugins:
  - search
  - glightbox
  - monorepo

markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: "pymdownx.details"
          class: "details"
          format: "!!python/name:pymdownx.superfences.fence_details_format"
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - toc:
      permalink: true

copyright: Copyright &copy; 2025 Five North Group

nav:
  - Home: index.md
  - 5N Infra:
    - 5n-infra/index.md
    - Hosted Node: hosted-node/hosted-node-access.md
    - Sandbox: sandbox/sandbox-access.md
    - Sponsor:
      - IP Restriction: sponsored-node/check-ip-allow-status.md
      - Network Param: sponsored-node/network-parameters.md
  - 5N Dashboard:
    - Overview: 5n-dashboard/introduction.md
    - Installation: 5n-dashboard/install.md
    - Release: 5n-dashboard/release.md
    - Guide:
      - DAR management: 5n-dashboard/dar-management.md
      - User management: 5n-dashboard/user-management.md
      - Party Management: 5n-dashboard/party-management.md
      - Shell: 5n-dashboard/shell.md
  - Loop SDK: '!include ./loop-sdk/docs/mkdocs.yml'
  - ID SDK: '!include ./id-sdk/docs/mkdocs.yml'
  - 5N Time Machine:
    - Overview: 5n-timemachine/introduction.md
    - Installation: 5n-timemachine/install.md
